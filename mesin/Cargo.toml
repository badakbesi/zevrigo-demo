# Mesin Zevrigo Node (DEC-44, DEC-45; Q196a): node dan penambang sebagai proses anak, dipakai aplikasi desktop app/src-tauri
# (workspace dan Cargo.lock sendiri, lewat path) dan mode `pengendali` program zevrigo-demo (anggota workspace ini). Tanpa
# paket baru: semua dependensi sudah ada di Cargo.lock zevrigo-demo dan Cargo.lock aplikasi.
[package]
name = "zevrigo-node-mesin"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
description = "Mesin Zevrigo Node: node dan penambang jaringan demo regtest sebagai proses anak (DEC-44, DEC-45)"

[dependencies]
serde.workspace = true
serde_json.workspace = true
# Runtime kecil untuk klien RPC di utas pemantau (pengganti MOD-12 Cli, yang membawa rpassword).
tokio = { workspace = true, features = ["rt"] }
zevrigo-primitives.workspace = true
# Tinggi chain node lokal dan gerbang RPC publik (MOD-08, termasuk HTTPS).
zevrigo-rpc.workspace = true
# Alamat hadiah bech32m menjadi payload miner (MOD-09); tanpa kunci rahasia.
zevrigo-wallet-core.workspace = true

[lints]
workspace = true

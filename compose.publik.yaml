# Layanan publik jaringan demo regtest lewat Cloudflare Tunnel (TSK-M44 sampai TSK-M47, TSK-M53, TSK-M54, Spesifikasi Docker
# v0.1 Bagian 7). Dipakai bersama compose.yaml. Setiap layanan punya profile; tanpa COMPOSE_PROFILES tidak ada layanan publik
# yang dinyalakan:
#
#   demo  SUSUNAN VPS RESMI (TSK-M76, DEC-47): sama persis di setiap VPS resmi Zevrigo; sekarang SATU VPS resmi (DEC-48):
#         node (seed), node-pengamat, explorer, gerbang-rpc, node-faucet + faucet, penambang-cadangan, cloudflared-zevrigo
#   pc    komputer pencipta: node-penambang + miner-berkala, node-treasury (kunci kantong treasury tidak pernah di VPS)
#   lama  tunnel lama *.ratuaurion.store (layanan cloudflared): SEMENTARA, hanya di VPS resmi pertama, sampai dihentikan
#         (DEC-42, paling cepat 23 Desember 2026); sesudah itu layanan dan profile ini dihapus
#
# VPS resmi: berkas ini dan compose.yaml disalin apa adanya (scripts/vps-resmi-pasang.sh) ke ~/zevrigo, dan semua pilihan dibaca
# dari ~/zevrigo/.env (contoh scripts/vps-resmi.env.contoh: COMPOSE_FILE, COMPOSE_PROFILES, ZVRG_HOST_SEED, ZVRG_DIAM). Perintahnya
# sama di setiap VPS:
#   cd ~/zevrigo && docker compose up -d --no-build        (berhenti: docker compose stop)
# Yang memang berbeda antar-VPS hanya token tunnel (~/.zevrigo.env), nama host seed VPS itu (ZVRG_HOST_SEED, karena setiap seed
# punya PeerId sendiri), jeda penambang cadangan (ZVRG_DIAM, agar dua VPS tidak menambang bersamaan), dan isi volume data.
# Pemeriksaan keseragaman: scripts/vps-resmi-periksa.sh (membandingkan ~/zevrigo/VERSI dan keadaan setiap VPS).
#
# PC:  COMPOSE_PROFILES=pc docker compose -f compose.yaml -f compose.publik.yaml up -d
#
# Image zevrigo:regtest dibangun di PC (docker compose ... build node) lalu dikirim ke VPS dengan docker save/load; ID image sama
# di semua mesin. Node di PC tersambung ke seed lewat alamat publik, sama seperti peserta. PC mati: tidak ada blok dari
# miner-berkala; penambang-cadangan di VPS menambang bila chain diam ZVRG_DIAM detik; layanan publik tetap menjawab.
#
# Token tunnel TIDAK disimpan di repo. Satu tunnel Cloudflare `zevrigo` (DEC-48; akun domain zevrigo.online, layanan
# cloudflared-zevrigo); token di ${HOME}/.zevrigo.env (izin 600, satu baris TUNNEL_TOKEN=). Route ("Published application"),
# semuanya tipe HTTP:
#   demo-explorer.zevrigo.online    -> localhost:28802   explorer
#   demo-seed-p2p.zevrigo.online    -> localhost:28803   seed P2P WebSocket (TLS diputus Cloudflare) = ZVRG_HOST_SEED
#   demo-gerbang-rpc.zevrigo.online -> localhost:28804   gerbang RPC wallet peserta (TSK-M53)
#   demo-faucet.zevrigo.online      -> node-faucet:28805 faucet demo (TSK-M54), lewat jaringan Docker
# Tunnel lama (profile lama, ${HOME}/.zevrigo-tunnel.env): zevrigo, zevrigo-seed, zevrigo-rpc, zevrigo-faucet .ratuaurion.store,
# tujuan sama; dipakai wallet 0.3.1 dan Explorer 0.1.0 (RENCANA_T13). Blog resmi tidak di VPS (Q186): https://zevrigo.online.
#
# Node lain bergabung dengan --seed-resmi (Q191, DEC-43: seed bawaan node, alamat dan PeerId di dalam node), atau dengan alamat:
#   --connect /dns4/demo-seed-p2p.zevrigo.online/tcp/443/tls/sni/demo-seed-p2p.zevrigo.online/ws/p2p/<PeerId seed>
# PeerId seed tercetak di log node sebagai baris p2p-ws: (kunci tetap di volume data). Setiap seed mengumumkan alamatnya ke rekan
# (--p2p-publik, TSK-M75) dan juga memakai --seed-resmi, sehingga seed resmi saling tersambung; alamat seed miliknya sendiri di
# daftar bawaan tidak menghasilkan rekan. Buku alamat di /data/regtest/peers.json (TSK-M74).
#
# Explorer mendengar di 127.0.0.1 (bawaan) di dalam namespace jaringan node. Satu-satunya jalan masuk dari luar adalah
# cloudflared yang berbagi namespace itu, sehingga --trust-proxy aman (TSK-M43). Port host dari compose.yaml dicabut; RPC dan
# P2P TCP node tidak terbuka; P2P WebSocket hanya di 127.0.0.1:28803 dan dicapai lewat cloudflared. Project zevrigo-publik,
# volume sendiri (zevrigo-publik_zvrg-data, ...). Saat ini regtest (pilihan pencipta 11 November 2026); testnet menyusul
# bersama genesis testnet (TSK-F06).
#
# Batas sumber daya sama di setiap VPS (TSK-M76): seed 384 MiB / 1 CPU; explorer, node lain, gerbang RPC, faucet 256 MiB /
# 0,5 CPU; penambang cadangan 128 MiB / 0,5 CPU (terukur Q125: node sekitar 10 MiB, node baru sinkron 8 detik).
#
# Jaringan demo (DEC-34, TSK-M47): node operator di container dan volume sendiri, tersambung ke seed resmi bawaan lewat alamat
# publik (internet dan Cloudflare, seperti peserta):
#   node-penambang  tempat miner-berkala (PC)      node-treasury  wallet treasury (PC)
#   node-faucet     layanan faucet (setiap VPS)    node-pengamat  hanya menerima siaran, saksi (setiap VPS)
#
# faucet (TSK-M54 bagian B): zevrigo-demo mode faucet di namespace node-faucet, wallet panas regtest di volume sendiri
# (zvrg-faucet-dompet: faucet-frasa.txt dibuat sekali dan faucet-batas.json); setiap VPS resmi punya wallet panas sendiri. Halaman
# /faucet/ explorer memanggil faucet (--faucet-origin di bawah). Diisi ulang bertahap dari kantong Faucet treasury:
#   COMPOSE_PROFILES=pc docker compose -f compose.yaml -f compose.publik.yaml exec node-treasury zevrigo-cli --datadir /data send \
#     --dari <alamat kantong Faucet> --to <alamat faucet dari log: alamat faucet:> --amount 10000
#
# miner-berkala (TSK-M46, TSK-M47): satu blok regtest setiap ZVRG_JEDA detik (bawaan 120 = waktu blok target), di namespace
# node-penambang. Hadiah ke payload di /data/payout-penambang (volume node-penambang, dipasang baca saja); selama file itu
# belum ada atau tidak sah, hadiah ke kunci NUMS yang tidak bisa dibelanjakan (sama dengan gerbang Q121). Ganti jeda:
#   ZVRG_JEDA=60 COMPOSE_PROFILES=pc docker compose -f compose.yaml -f compose.publik.yaml up -d --no-deps miner-berkala
name: zevrigo-publik

services:
  node:
    profiles: ["demo"]
    # Q191 (DEC-43, TSK-M75): seed mengumumkan alamat wss resminya ke rekan lewat pertukaran alamat (protokol addr). TSK-M76:
    # nama host dari ZVRG_HOST_SEED (~/zevrigo/.env VPS itu; bawaan seed pertama), dan --seed-resmi agar seed resmi saling
    # tersambung (seed kedua ke seed pertama, Q204b).
    command: ["--regtest", "--datadir", "/data", "--p2p-ws-port", "28803", "--p2p-publik", "/dns4/${ZVRG_HOST_SEED:-demo-seed-p2p.zevrigo.online}/tcp/443/tls/sni/${ZVRG_HOST_SEED:-demo-seed-p2p.zevrigo.online}/ws", "--seed-resmi"]
    ports: !reset []
    mem_limit: 384m
    cpus: 1.0

  explorer:
    profiles: ["demo"]
    command:
      - --regtest
      - --datadir
      - /data
      - --web-dir
      - /usr/share/zevrigo/web
      - --trust-proxy
      # TSK-M54: halaman /faucet/ boleh memanggil layanan faucet (connect-src). Q187: faucet host baru (web memanggilnya).
      - --faucet-origin
      - https://demo-faucet.zevrigo.online
    mem_limit: 256m
    cpus: 0.5

  gerbang-rpc:
    profiles: ["demo"]
    # TSK-M53 (DEC-36): zevrigo-demo mode rpc, di namespace node seed (RPC node lewat 127.0.0.1:28801). Hanya metode aman
    # yang diteruskan; get_block_template dan submit_block dijawab -32601. Mendengar di 127.0.0.1:28804, hanya dicapai lewat
    # cloudflared; --trust-proxy aman karena yang tersambung lewat loopback hanya proses di namespace ini.
    # Q173 (21 November 2026): --rate 60 (per pengunjung 60/detik, kapasitas 240; bersama 1.200/detik). Bawaan 20 terlalu kecil
    # untuk wallet 0.3.0 yang memindai riwayat dari genesis (2 permintaan per blok tanpa jeda): wallet baru di PC mendapat 429.
    image: zevrigo:regtest
    pull_policy: never
    entrypoint: ["zevrigo-demo"]
    command: ["rpc", "--trust-proxy", "--rate", "60"]
    network_mode: "service:node"
    depends_on:
      - node
    mem_limit: 256m
    cpus: 0.5
    stop_grace_period: 10s
    restart: unless-stopped

  penambang-cadangan:
    profiles: ["demo"]
    # Q181 (21 November 2026, pencipta: penambang cadangan di VPS, mode cadangan, hadiah ke alamat penambang PC, pasang
    # secepatnya; TSK-M76: di setiap VPS resmi, ZVRG_DIAM berbeda per VPS lewat ~/zevrigo/.env): di namespace node seed (RPC 127.0.0.1:28801 bawaan zevrigo-cli dan zevrigo-miner, tidak lewat gerbang
    # publik). Setiap 30 detik membaca tinggi chain; menambang satu blok hanya bila tinggi tidak naik selama ZVRG_DIAM detik
    # (bawaan 300), misalnya saat PC mati. Selama miner-berkala PC jalan (satu blok per 120 detik) layanan ini diam. Sesudah
    # mulai juga menunggu ZVRG_DIAM detik, agar node seed yang baru menyala sempat sinkron dulu. ZVRG_PAYOUT = payload x-only
    # alamat penambang PC (publik, dari /data/payout-penambang node-penambang; wallet penambang baru 28 November 2026, Q212b); tidak ada kunci rahasia di VPS.
    image: zevrigo:regtest
    pull_policy: never
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        case "$$ZVRG_PAYOUT" in *[!0-9a-f]* | "") echo "penambang-cadangan: ZVRG_PAYOUT tidak sah, tidak menambang"; exec sleep infinity ;; esac
        [ "$${#ZVRG_PAYOUT}" -eq 64 ] || { echo "penambang-cadangan: ZVRG_PAYOUT bukan 64 hex, tidak menambang"; exec sleep infinity; }
        echo "penambang-cadangan: menambang satu blok bila tinggi tidak naik $$ZVRG_DIAM detik"
        last=""; since=$$(date +%s)
        while :; do
          h=$$(zevrigo-cli info 2>/dev/null | sed -n 's/^tinggi: //p')
          now=$$(date +%s)
          if [ -n "$$h" ] && [ "$$h" != "$$last" ]; then last=$$h; since=$$now; fi
          if [ -n "$$h" ] && [ $$((now - since)) -ge "$$ZVRG_DIAM" ]; then
            echo "penambang-cadangan: tinggi $$h diam $$((now - since)) detik, menambang satu blok"
            zevrigo-miner --payout "$$ZVRG_PAYOUT" --blocks 1 || echo "penambang-cadangan: putaran gagal, dicoba lagi"
            since=$$(date +%s)
          fi
          sleep 30
        done
    environment:
      ZVRG_PAYOUT: "bce31560d861cd41eb26456a472df2f8e86408a67d303bd10a384cc9e3d793db"
      ZVRG_DIAM: ${ZVRG_DIAM:-300}
    network_mode: "service:node"
    init: true
    depends_on:
      - node
    mem_limit: 128m
    cpus: 0.5
    stop_grace_period: 10s
    restart: unless-stopped

  cloudflared:
    profiles: ["lama"]
    # Tunnel lama *.ratuaurion.store, SEMENTARA (profile lama, hanya VPS resmi pertama) sampai dihentikan (DEC-42, paling cepat
    # 23 Desember 2026); lalu layanan ini dihapus. cloudflared 2026.10.7 (Q120), image resmi dikunci digest (DEC-10 bagian 9).
    # required: false agar VPS lain (tanpa berkas ini) tetap bisa membaca compose.
    image: cloudflare/cloudflared@sha256:4955524aeaa379e154023d5a027c250f7b35041a2e7e950cf13f144bc9b9c5ba
    command: ["tunnel", "--no-autoupdate", "run"]
    env_file:
      - path: ${HOME}/.zevrigo-tunnel.env
        required: false
    network_mode: "service:node"
    depends_on:
      - explorer
    stop_grace_period: 30s
    restart: unless-stopped

  cloudflared-zevrigo:
    profiles: ["demo"]
    # Q187 (22 November 2026, pencipta): tunnel `zevrigo` untuk host *.zevrigo.online (DEC-48),
    # route di kepala berkas. localhost = namespace node seed, dan faucet mempercayai CF-Connecting-IP dari alamat layanan
    # node (--trust-proxy-host node). Token tidak di repo.
    image: cloudflare/cloudflared@sha256:4955524aeaa379e154023d5a027c250f7b35041a2e7e950cf13f144bc9b9c5ba
    command: ["tunnel", "--no-autoupdate", "run"]
    # Token hanya ada di VPS; required: false agar compose profil pc (PC tanpa berkas ini) tetap terbaca. Di VPS
    # scripts/vps-resmi-pasang.sh memeriksa ~/.zevrigo.env ada (izin 600).
    env_file:
      - path: ${HOME}/.zevrigo.env
        required: false
    network_mode: "service:node"
    depends_on:
      - explorer
    stop_grace_period: 30s
    restart: unless-stopped

  miner-berkala:
    profiles: ["pc"]
    image: zevrigo:regtest
    pull_policy: never
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo "miner-berkala: satu blok setiap $$ZVRG_JEDA detik, menunggu node-penambang sinkron 30 detik"
        sleep 30
        while :; do
          P=$$(cat /data/payout-penambang 2>/dev/null | tr -d ' \n')
          case "$$P" in *[!0-9a-f]* | "") P="" ;; esac
          if [ "$${#P}" -eq 64 ]; then echo "miner-berkala: payout alamat penambang"; else P="$$ZVRG_NUMS"; echo "miner-berkala: payout NUMS (belum ada /data/payout-penambang)"; fi
          zevrigo-miner --payout "$$P" --blocks 1 || echo "miner-berkala: putaran gagal, dicoba lagi"
          sleep "$$ZVRG_JEDA"
        done
    environment:
      ZVRG_NUMS: 50929b74c1a04954b78b4b6035e97a5e078a5a0f28ec96d547bfee9ace803ac0
      ZVRG_JEDA: ${ZVRG_JEDA:-120}
    volumes:
      - zvrg-penambang:/data:ro
    network_mode: "service:node-penambang"
    init: true
    depends_on:
      - node-penambang
    mem_limit: 256m
    cpus: 0.5
    stop_grace_period: 10s
    restart: unless-stopped

  node-penambang:
    profiles: ["pc"]
    image: zevrigo:regtest
    pull_policy: never
    # Q191 (DEC-43, TSK-M73): seed resmi bawaan node (demo-seed-p2p.zevrigo.online, PeerId di dalam node), bukan alamat panjang.
    command: &node-operator ["--regtest", "--datadir", "/data", "--seed-resmi"]
    volumes:
      - zvrg-penambang:/data
    mem_limit: 256m
    cpus: 0.5
    stop_grace_period: 30s
    restart: unless-stopped

  node-treasury:
    profiles: ["pc"]
    image: zevrigo:regtest
    pull_policy: never
    command: *node-operator
    volumes:
      - zvrg-treasury:/data
    mem_limit: 256m
    cpus: 0.5
    stop_grace_period: 30s
    restart: unless-stopped

  node-faucet:
    profiles: ["demo"]
    image: zevrigo:regtest
    pull_policy: never
    command: *node-operator
    volumes:
      - zvrg-faucet:/data
    mem_limit: 256m
    cpus: 0.5
    stop_grace_period: 30s
    restart: unless-stopped

  faucet:
    profiles: ["demo"]
    # TSK-M54 bagian B (DEC-36): zevrigo-demo mode faucet, RPC node-faucet lewat 127.0.0.1:28801 di namespace yang sama.
    # Mendengar 0.0.0.0:28805 di jaringan Docker (tanpa port host); cloudflared (namespace node) menjangkaunya lewat
    # http://node-faucet:28805. CF-Connecting-IP hanya dipercaya dari alamat layanan node (namespace cloudflared).
    image: zevrigo:regtest
    pull_policy: never
    entrypoint: ["zevrigo-demo"]
    # Q187: faucet dipanggil dari halaman explorer dan host lama (DEC-42, DEC-48).
    command:
      - faucet
      - --datadir
      - /data
      - --http-bind
      - 0.0.0.0
      - --trust-proxy-host
      - node
      - --allow-origin
      - https://demo-explorer.zevrigo.online
      - --allow-origin
      - https://zevrigo.ratuaurion.store
    network_mode: "service:node-faucet"
    volumes:
      - zvrg-faucet-dompet:/data
    depends_on:
      - node-faucet
    mem_limit: 256m
    cpus: 0.5
    stop_grace_period: 10s
    restart: unless-stopped

  node-pengamat:
    profiles: ["demo"]
    image: zevrigo:regtest
    pull_policy: never
    command: *node-operator
    volumes:
      - zvrg-pengamat:/data
    mem_limit: 256m
    cpus: 0.5
    stop_grace_period: 30s
    restart: unless-stopped

volumes:
  zvrg-penambang:
  zvrg-treasury:
  zvrg-faucet:
  zvrg-faucet-dompet:
  zvrg-pengamat:

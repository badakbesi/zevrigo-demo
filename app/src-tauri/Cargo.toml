# Aplikasi Zevrigo Node untuk Windows dan Linux (RENCANA_T16, DEC-44; pencipta 24 November 2026). Workspace Cargo sendiri dengan
# Cargo.lock sendiri, terpisah dari program zevrigo-demo di akar repo: Cargo.lock akar, paket Docker, dan CI demo tidak berubah.
# Aturan lint dan toolchain (rust-toolchain.toml akar) sama dengan repo ini. Cargo.lock aplikasi ini adalah bagian dari Cargo.lock
# wallet MOD-15 (diperiksa skrip gerbang Q194, Q196a).
[package]
name = "zevrigo-node-app"
version = "0.1.0"
edition = "2024"
rust-version = "1.99.0"
publish = false
license = "MIT OR Apache-2.0"
description = "Zevrigo Node: aplikasi node dan penambang jaringan demo regtest (Tauri 2, sidecar zevrigo-node dan zevrigo-miner)"

# Nama berbeda dari program agar berkas hasil build tidak bentrok di Windows (pola MOD-15). Program tidak bernama zevrigo-node
# karena nama itu dipakai sidecar node di folder yang sama. Q199c: pustaka juga untuk Android (Tauri mobile memuat cdylib lewat
# JNI; staticlib untuk iOS nanti), sama dengan wallet MOD-15 dan aplikasi Explorer.
[lib]
name = "zevrigo_node_app_lib"
path = "src/lib.rs"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "zevrigo-node-app"
path = "src/main.rs"

[build-dependencies]
tauri-build.workspace = true

[dependencies]
tauri.workspace = true
tauri-plugin-opener.workspace = true
serde.workspace = true
serde_json.workspace = true
# Mesin node + penambang (DEC-45, Q196a): crate zevrigo-demo/mesin, dipakai juga mode `pengendali` zevrigo-demo. Membawa
# MOD-08 (tinggi chain lokal dan gerbang publik) dan MOD-09 (alamat hadiah); tanpa kunci rahasia.
zevrigo-node-mesin.workspace = true
# Klien VPS untuk aplikasi Android (DEC-46, RENCANA_T17 bagian 13, Q199a): fitur `vps`, mati secara bawaan sehingga program
# desktop tidak berubah. russh + kripto ring tanpa fitur bawaan (86 paket baru di Cargo.lock, tepat daftar Q197 V1); tokio,
# getrandom, sha2, hex, zeroize sudah ada di Cargo.lock.
russh = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
getrandom = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
hex = { workspace = true, optional = true }
zeroize = { workspace = true, optional = true }
# Brankas kata sandi aplikasi (Q199b): vault MOD-09 (Argon2id + XChaCha20-Poly1305), sama dengan Zevrigo Wallet; paket ini sudah
# ada di Cargo.lock lewat mesin.
zevrigo-wallet-core = { workspace = true, optional = true }

[features]
# Modul `vps` (src/vps): SSH ke VPS pengguna, skrip bantu demo-zevrigo-kendali, terowongan ke pengendali. Dipakai build Android
# (Q199c) dan uji sungguhan `examples/uji-vps.rs` (Q199a).
vps = [
    "dep:russh",
    "dep:tokio",
    "dep:getrandom",
    "dep:sha2",
    "dep:hex",
    "dep:zeroize",
    "dep:zevrigo-wallet-core",
]

# Uji sungguhan modul vps dari PC ke VPS (q199a_uji.sh pencipta); hanya dengan fitur vps.
[[example]]
name = "uji-vps"
path = "examples/uji-vps.rs"
required-features = ["vps"]

# Uji sungguhan layanan VPS aplikasi (brankas, tahap, ambil alih) dari PC ke VPS (q199b_uji.sh pencipta); hanya dengan fitur vps.
[[example]]
name = "uji-layanan"
path = "examples/uji-layanan.rs"
required-features = ["vps"]

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "warn"
dbg_macro = "deny"
float_arithmetic = "deny"
float_cmp = "deny"
float_cmp_const = "deny"
lossy_float_literal = "deny"
cast_precision_loss = "deny"
imprecise_flops = "deny"
suboptimal_flops = "deny"

# Akar workspace sendiri (tidak ikut workspace program zevrigo-demo di akar repo).
[workspace]
resolver = "3"

# Versi ditulis di workspace dan paket memakai `.workspace = true` (pola wallet MOD-15 dan aplikasi Explorer): Tauri CLI menulis
# ulang dependensi tauri di [dependencies], tetapi tidak menyentuh dependensi workspace.
[workspace.dependencies]
# DEC-44 (pencipta 24 November 2026): versi dan fitur sama persis dengan wallet MOD-15 (DEC-10 bagian 11 dan 14, RENCANA_T9 F5).
tauri = { version = "=2.12.3" }
tauri-build = { version = "=2.7.2" }
tauri-plugin-opener = { version = "=2.7.3" }
serde = { version = "1.0.229", default-features = false, features = ["std", "derive"] }
serde_json = { version = "1.0.154", default-features = false, features = ["std"] }
# Mesin di repo ini (folder zevrigo-demo/mesin); crate inti di dalamnya dari repo `zevrigo` di folder sebelah (AGENDA P3).
zevrigo-node-mesin = { path = "../../mesin" }
# Crate inti di repo `zevrigo` folder sebelah, jalur sama dengan mesin (satu paket di Cargo.lock).
zevrigo-wallet-core = { path = "../../../zevrigo/crates/wallet-core" }
# DEC-46 (pencipta 25 November 2026): SSH untuk Android = russh + ring, tanpa fitur bawaan (tanpa aws-lc-rs, flate2, RSA).
russh = { version = "=0.65.4", default-features = false, features = ["ring"] }
# Versi yang sudah ada di Cargo.lock (sama dengan wallet MOD-15).
tokio = { version = "=1.54.1", default-features = false, features = ["rt", "net", "io-util", "time", "sync"] }
getrandom = { version = "0.3.4", default-features = false }
sha2 = { version = "0.10.9", default-features = false }
hex = { version = "0.4.3", default-features = false, features = ["alloc"] }
zeroize = { version = "1.9.1", default-features = false, features = ["alloc"] }
